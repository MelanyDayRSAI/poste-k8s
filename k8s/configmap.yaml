# Configuración NO secreta. Cambia INSTANCE_CONNECTION_NAME por el de tu instancia de Cloud SQL
# (formato TU_CONEXION_CLOUDSQL; se obtiene con: gcloud sql instances describe INSTANCIA --format='value(connectionName)')
apiVersion: v1
kind: ConfigMap
metadata:
  name: poste-config
  namespace: mromeros7
data:
  NODE_ENV: "production"
  PORT: "500"
  # La app habla con el Cloud SQL Auth Proxy que corre como sidecar en el mismo pod
  PGHOST: "127.0.0.1"
  PGPORT: "5432"
  PGDATABASE: "poste"
  INSTANCE_CONNECTION_NAME: "TU_CONEXION_CLOUDSQL"
  # Detrás de un Ingress con HTTPS: poner COOKIE_SECURE en "true"
  COOKIE_SECURE: "false"
  TRUST_PROXY: "true"
  # Opcionales (correo). Si SMTP_HOST queda vacío, los correos se registran como "simulado".
  NOTIFY_EMAIL: ""
  SMTP_HOST: ""
  SMTP_PORT: "465"
  SMTP_FROM: ""
