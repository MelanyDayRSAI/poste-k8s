apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: mromeros7
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "poste"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "Poste2026Secure!"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  namespace: mromeros7
spec:
  selector:
    app: postgres-db
  ports:
  - port: 5432
    targetPort: 5432
