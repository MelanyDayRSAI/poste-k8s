# OPCIONAL: escala entre 2 y 4 réplicas según el CPU. Requiere metrics-server en el clúster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: poste-mini-muni
  namespace: mromeros7
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: poste-mini-muni
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
