apiVersion: apps/v1
kind: Deployment
metadata:
  name: poste-mini-muni
  namespace: mromeros7
spec:
  replicas: 2
  selector:
    matchLabels:
      app: poste-mini-muni
  template:
    metadata:
      labels:
        app: poste-mini-muni
    spec:
      containers:
      - name: app
        image: mipatito/poste-mini-muni:3.0
        ports:
        - containerPort: 500
        envFrom:
        - configMapRef:
            name: poste-config
        - secretRef:
            name: poste-secrets
