<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporta tu Poste - Boca del Monte</title>
<style>
  :root{--g9:#1F4D3A;--g7:#2F7D5B;--g6:#3E8E6B;--g2:#E3F1E8;--g1:#F1F8F3;--bg:#F6F9F6;--card:#fff;--ink:#1F2A24;--muted:#66756C;--line:#E1EAE4;--err:#B5443B;--star:#E3B04B}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45}
  button,input,select,textarea{font:inherit}
  :focus-visible{outline:2px solid #8CC6A7;outline-offset:2px}
  .top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .wrap{max-width:980px;margin:0 auto;padding:0 18px}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--g9);font-size:17px}
  .brand i{width:12px;height:12px;border-radius:50%;background:var(--g6);box-shadow:0 0 0 4px var(--g2)}
  .brand small{font-weight:500;color:var(--muted);font-size:12.5px}
  .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .role{background:var(--g2);color:var(--g9);border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:700}
  nav{display:flex;gap:6px;padding-bottom:12px;overflow-x:auto}
  nav button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 14px;border-radius:20px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
  nav button.on{background:var(--g7);border-color:var(--g7);color:#fff}
  main{padding:20px 0 50px}
  h2{font-size:19px;margin:0 0 14px;color:var(--g9)} h3{font-size:15px;margin:0 0 10px;color:var(--g9)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .narrow{max-width:460px;margin:30px auto}
  .grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fit,minmax(165px,1fr));margin-bottom:14px}
  .charts{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .kpi b{display:block;font-size:26px;color:var(--g9);line-height:1.15}.kpi span{font-size:12.5px;color:var(--muted)}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:13px 0 5px}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--g1);color:var(--ink)}
  textarea{resize:vertical;min-height:64px}
  .box textarea{margin-top:8px}
  .btn{border:none;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--g7);color:#fff}
  .btn:hover{background:var(--g9)} .btn.full{width:100%;margin-top:16px}
  .btn.soft{background:var(--g2);color:var(--g9)} .btn.soft:hover{background:#d3e8da}
  .btn.sm{padding:7px 12px;font-size:13px}.btn.link{background:none;color:var(--muted);padding:6px 8px;font-weight:600}
  .seg{display:flex;background:var(--g2);border-radius:10px;padding:3px;margin-bottom:6px}
  .seg button{flex:1;border:none;background:none;padding:8px;border-radius:8px;cursor:pointer;font-weight:700;color:var(--g9)}
  .seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .ferr{color:var(--err);font-size:13px;min-height:18px;margin-top:10px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.row2{grid-template-columns:1fr}}
  .prev{max-width:100%;max-height:200px;border-radius:10px;margin-top:8px;display:none}
  .rep{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}.rep:last-child{border-bottom:none}
  .rep>img,.rep>.ph{width:84px;height:84px;object-fit:cover;border-radius:10px;flex-shrink:0;background:var(--g1);border:1px solid var(--line)}
  .rep .t{font-weight:700}.rep .m{font-size:13px;color:var(--muted);margin-top:2px}.rep .body{flex:1;min-width:0}
  .badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:20px;margin-left:6px;vertical-align:1px}
  .b-pend{background:#FFF4D9;color:#7A5600}.b-rev{background:#E3EEFB;color:#1F4F8F}.b-res{background:#E1F2E7;color:#1F6B41}
  .reply{background:var(--g1);border-left:3px solid var(--g6);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:13.5px}
  .stars{display:inline-flex;gap:2px}.stars button{background:none;border:none;font-size:24px;cursor:pointer;color:#cfd8d2;padding:0 2px;line-height:1}
  .stars button.on{color:var(--star)}.stat{color:var(--star);letter-spacing:1px}
  .box{margin-top:10px;padding:12px;border:1px dashed #b9d5c4;border-radius:10px;background:var(--g1)}
  .empty{color:var(--muted);text-align:center;padding:26px 8px;font-size:14px}
  .donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.donut svg{width:140px;height:140px}
  .legend{list-style:none;margin:0;padding:0;font-size:13.5px}.legend li{margin:5px 0;display:flex;align-items:center;gap:8px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}.legend b{margin-left:4px}
  .bars{width:100%;height:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:12px;font-weight:700}
  .ok{text-align:center;padding:10px}.check{width:62px;height:62px;border-radius:50%;background:var(--g7);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
  .code{display:inline-block;background:var(--g2);color:var(--g9);border-radius:8px;padding:6px 14px;font-weight:700;margin:8px 0}
  .tip{font-size:12.5px;color:var(--muted);margin-top:8px}
  .filters{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}.filters select{width:auto}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--g9);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
  #toast.show{opacity:1}#toast.err{background:var(--err)}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st = { me:null, cfg:{smtp:false}, view:'', reports:[], users:[], emails:[], emailsSmtp:false, authMode:'login', filter:'todos', t0:0, foto:'', done:null };

async function api(method, url, body) {
  const opt = { method, credentials:'same-origin' };
  if (method !== 'GET') { opt.headers = { 'Content-Type':'application/json' }; opt.body = JSON.stringify(body || {}); }
  const r = await fetch(url, opt); let d = {};
  try { d = await r.json(); } catch {}
  if (!r.ok) throw new Error(d.error || ('Error ' + r.status));
  return d;
}
let tt; function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(tt); tt = setTimeout(() => t.className = '', 3200); }

const fmtDate = d => new Date(d).toLocaleString('es-GT', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
const fmtSec = s => s < 60 ? s + ' s' : Math.floor(s/60) + ' min ' + String(Math.round(s%60)).padStart(2,'0') + ' s';
const fmtHrs = h => h < 1 ? Math.max(1, Math.round(h*60)) + ' min' : h < 48 ? h.toFixed(1) + ' h' : (h/24).toFixed(1) + ' días';
const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
const bcls = s => s === 'Pendiente' ? 'b-pend' : s === 'En revisión' ? 'b-rev' : 'b-res';
const badge = s => `<span class="badge ${bcls(s)}">${esc(s)}</span>`;

// ---------- gráficos SVG ----------
function donut(items) {
  const tot = items.reduce((a, b) => a + b.v, 0);
  if (!tot) return '<div class="empty">Sin datos todavía</div>';
  let off = 25;
  const segs = items.filter(i => i.v > 0).map(i => { const p = i.v / tot * 100;
    const s = `<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${i.c}" stroke-width="5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`; off -= p; return s; }).join('');
  return `<div class="donut"><svg viewBox="0 0 42 42" role="img" aria-label="Reportes por estado"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#EAF1EC" stroke-width="5"/>${segs}<text x="21" y="23" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1F4D3A">${tot}</text></svg>
  <ul class="legend">${items.map(i => `<li><i style="background:${i.c}"></i>${esc(i.l)} <b>${i.v}</b></li>`).join('')}</ul></div>`;
}
function bars(labels, vals, color) {
  const max = Math.max(1, ...vals), H = 130, W = labels.length * 44;
  return `<svg viewBox="0 0 ${W} ${H+28}" class="bars" role="img">${vals.map((v, i) => { const h = Math.round(v / max * (H - 18)), x = i * 44 + 8;
    return `<rect x="${x}" y="${H-h}" width="28" height="${h}" rx="5" fill="${color}"/><text x="${x+14}" y="${H-h-5}" text-anchor="middle" font-size="11" fill="#4B5B52">${v}</text><text x="${x+14}" y="${H+16}" text-anchor="middle" font-size="10" fill="#66756C">${esc(labels[i])}</text>`; }).join('')}</svg>`;
}

// ---------- vistas ----------
function authView() {
  const reg = st.authMode === 'register';
  return `<div class="wrap"><div class="card narrow">
    <div class="brand" style="margin-bottom:14px"><i></i>Reporta tu Poste <small>Boca del Monte</small></div>
    <div class="seg"><button data-act="mode" data-m="login" class="${reg ? '' : 'on'}">Ingresar</button><button data-act="mode" data-m="register" class="${reg ? 'on' : ''}">Crear cuenta</button></div>
    <form data-form="${reg ? 'register' : 'login'}">
      ${reg ? `<label>Nombre completo</label><input name="name" required minlength="3" autocomplete="name">
               <label>Teléfono</label><input name="phone" type="tel" required placeholder="Ej: 5555 1234" autocomplete="tel">` : ''}
      <label>Correo electrónico</label><input name="email" type="email" required autocomplete="email">
      <label>Contraseña${reg ? ' (mínimo 6 caracteres)' : ''}</label><input name="password" type="password" required ${reg ? 'minlength="6"' : ''} autocomplete="${reg ? 'new-password' : 'current-password'}">
      <div class="ferr"></div>
      <button class="btn full">${reg ? 'Crear cuenta' : 'Ingresar'}</button>
    </form>
    <p class="tip">${reg ? 'Con tu cuenta podrás reportar postes apagados y dar seguimiento.' : 'Si eres de la Mini Muni, ingresa con la cuenta de administrador.'}</p>
  </div></div>`;
}
const NAV = { vecino:[['mis','Mis reportes'],['nuevo','Nuevo reporte']], admin:[['panel','Panel'],['reportes','Reportes'],['usuarios','Usuarios'],['correos','Correos']] };
function shell(inner) {
  const nav = NAV[st.me.role].map(([k, l]) => `<button data-act="go" data-v="${k}" class="${st.view === k || (st.view === 'hecho' && k === 'nuevo') ? 'on' : ''}">${l}</button>`).join('');
  return `<div class="top"><div class="wrap"><div class="bar">
    <div class="brand"><i></i>Reporta tu Poste <small>Boca del Monte</small></div>
    <div class="who"><span>${esc(st.me.name)}</span><span class="role">${st.me.role === 'admin' ? 'Administrador' : 'Vecino'}</span><button class="btn link" data-act="logout">Salir</button></div>
  </div><nav>${nav}</nav></div></div><div class="wrap"><main>${inner}</main></div>`;
}

function repCard(r, admin) {
  const rate = admin ? (r.rating ? `<div class="reply"><span class="stat">${stars(r.rating)}</span> ${r.feedback ? esc(r.feedback) : '<i>Sin comentario</i>'}</div>` : '')
    : r.status === 'Resuelto' ? (r.rating
        ? `<div class="reply">Tu calificación: <span class="stat">${stars(r.rating)}</span>${r.feedback ? '<br>' + esc(r.feedback) : ''}</div>`
        : `<form class="box" data-form="rate" data-id="${r.id}"><b>¿Cómo fue la atención?</b><br>
            <span class="stars">${[1,2,3,4,5].map(n => `<button type="button" data-act="star" data-v="${n}" aria-label="${n} estrellas">★</button>`).join('')}</span>
            <textarea name="feedback" placeholder="Déjanos tu comentario (opcional)" maxlength="500"></textarea>
            <div class="ferr"></div><button class="btn sm">Enviar calificación</button></form>`) : '';
  const adm = admin ? `<form class="box" data-form="status" data-id="${r.id}">
      <div class="row2"><div><label style="margin-top:0">Estado</label><select name="status">${['Pendiente','En revisión','Resuelto'].map(s => `<option${s === r.status ? ' selected' : ''}>${s}</option>`).join('')}</select></div>
      <div><label style="margin-top:0">Contacto</label><div style="padding:9px 0;font-size:13.5px">${esc(r.phone)}<br>${esc(r.email)}</div></div></div>
      <label>Mensaje para el vecino (se envía por correo)</label><textarea name="reply" maxlength="500">${esc(r.admin_reply)}</textarea>
      <div class="ferr"></div><button class="btn sm">Guardar cambios</button></form>`
    : (r.admin_reply ? `<div class="reply"><b>Mini Muni:</b> ${esc(r.admin_reply)}</div>` : '');
  return `<div class="rep"><img src="/api/reports/${r.id}/photo" alt="Foto del poste" loading="lazy">
    <div class="body"><div class="t">${esc(r.location)}${badge(r.status)}</div>
    <div class="m">${esc(r.reference)}${r.note ? ' · ' + esc(r.note) : ''}</div>
    <div class="m">${esc(r.code)} · ${fmtDate(r.created_at)}${admin ? ' · por ' + esc(r.name) : ''}${r.form_seconds ? ' · llenado en ' + fmtSec(r.form_seconds) : ''}</div>
    ${adm}${rate}</div></div>`;
}

function viewMis() {
  return `<div class="card"><h2>Mis reportes</h2>${st.reports.length ? st.reports.map(r => repCard(r, false)).join('') : '<div class="empty">Aún no has enviado reportes.</div>'}</div>`;
}
function viewNuevo() {
  const m = st.me;
  return `<div class="card" style="max-width:560px;margin:0 auto"><h2>Nuevo reporte</h2>
  <form data-form="new">
    <label>Foto del poste *</label><input type="file" name="foto" accept="image/*" capture="environment"><img class="prev" id="prev" alt="Vista previa">
    <label>Ubicación *</label><input name="location" required minlength="3" placeholder="Ej: Calle Real, Boca del Monte">
    <button type="button" class="btn soft sm" data-act="gps" style="margin-top:6px">Usar mi ubicación (GPS)</button>
    <label>Referencia del lugar *</label><input name="reference" required minlength="3" placeholder="Ej: frente a Farmacia San José">
    <label>Algo más (opcional)</label><input name="note" maxlength="300" placeholder="Ej: parpadea, hay varios apagados">
    <h3 style="margin-top:20px">Tus datos de contacto</h3>
    <label style="margin-top:0">Nombre *</label><input name="name" required minlength="3" value="${esc(m.name)}">
    <div class="row2"><div><label>Teléfono *</label><input name="phone" type="tel" required value="${esc(m.phone)}" placeholder="5555 1234"></div>
    <div><label>Correo *</label><input name="email" type="email" required value="${esc(m.email)}"></div></div>
    <div class="ferr"></div><button class="btn full">Enviar a la Mini Muni</button>
  </form></div>`;
}
function viewHecho() {
  const d = st.done; if (!d) return '';
  const mail = d.mail === 'smtp' ? `Te enviamos un correo de confirmación a <b>${esc(d.report.email)}</b>.`
    : `El correo de confirmación quedó registrado (envío simulado: el servidor aún no tiene SMTP configurado).`;
  return `<div class="card" style="max-width:480px;margin:20px auto"><div class="ok"><div class="check">✓</div>
    <h2>¡Gracias, ${esc(d.report.name.split(' ')[0])}!</h2><p style="color:var(--muted);margin:4px 0">Tu reporte fue enviado a la Mini Muni de Boca del Monte.</p>
    <div class="code">N.º de reporte: ${esc(d.report.code)}</div>
    <p style="margin:6px 0">Llenar el reporte te tomó <b>${fmtSec(d.report.form_seconds)}</b>.</p><p class="tip">${mail}</p>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:center"><button class="btn" data-act="go" data-v="mis">Ver mis reportes</button><button class="btn soft" data-act="go" data-v="nuevo">Otro reporte</button></div></div></div>`;
}

function calc() {
  const R = st.reports, by = s => R.filter(r => r.status === s).length;
  const forms = R.map(r => r.form_seconds).filter(x => x > 0);
  const res = R.filter(r => r.resolved_at).map(r => (new Date(r.resolved_at) - new Date(r.created_at)) / 36e5);
  const rated = R.filter(r => r.rating);
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
  const days = [], labels = [], counts = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d.toLocaleDateString('en-CA')); labels.push(String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0')); }
  days.forEach(k => counts.push(R.filter(r => new Date(r.created_at).toLocaleDateString('en-CA') === k).length));
  return { total:R.length, p:by('Pendiente'), v:by('En revisión'), s:by('Resuelto'), form:avg(forms), resH:avg(res), nRes:res.length, rate:avg(rated.map(r => r.rating)), nRate:rated.length,
    dist:[1,2,3,4,5].map(n => rated.filter(r => r.rating === n).length), labels, counts, comments:rated.filter(r => r.feedback).slice(0, 5) };
}
function viewPanel() {
  const k = calc();
  return `<h2>Panel de la Mini Muni</h2>
  <div class="grid kpis">
    <div class="card kpi"><b>${k.total}</b><span>Reportes recibidos</span></div>
    <div class="card kpi"><b>${st.users.filter(u => u.role === 'vecino').length}</b><span>Vecinos registrados</span></div>
    <div class="card kpi"><b>${k.form ? fmtSec(Math.round(k.form)) : '—'}</b><span>Tiempo promedio para llenar un reporte</span></div>
    <div class="card kpi"><b>${k.nRes ? fmtHrs(k.resH) : '—'}</b><span>Tiempo promedio de resolución (${k.nRes} resueltos)</span></div>
    <div class="card kpi"><b>${k.nRate ? k.rate.toFixed(1) + ' ★' : '—'}</b><span>Calificación promedio (${k.nRate} opiniones)</span></div>
  </div>
  <div class="grid charts">
    <div class="card"><h3>Reportes por estado</h3>${donut([{l:'Pendiente',v:k.p,c:'#E3B04B'},{l:'En revisión',v:k.v,c:'#6C9BD1'},{l:'Resuelto',v:k.s,c:'#4FA77D'}])}</div>
    <div class="card"><h3>Reportes por día (últimos 7 días)</h3>${bars(k.labels, k.counts, '#4FA77D')}</div>
    <div class="card"><h3>Calificaciones de los vecinos</h3>${k.nRate ? bars(['1★','2★','3★','4★','5★'], k.dist, '#E3B04B') : '<div class="empty">Aún no hay calificaciones</div>'}</div>
    <div class="card"><h3>Comentarios recientes</h3>${k.comments.length ? k.comments.map(r => `<div class="reply" style="margin:0 0 8px"><span class="stat">${stars(r.rating)}</span> ${esc(r.feedback)}<div class="m" style="font-size:12px;color:var(--muted)">${esc(r.code)} · ${esc(r.name)}</div></div>`).join('') : '<div class="empty">Sin comentarios todavía</div>'}</div>
  </div>`;
}
function viewReportes() {
  const list = st.filter === 'todos' ? st.reports : st.reports.filter(r => r.status === st.filter);
  return `<div class="card"><div class="filters"><h2 style="margin:0">Reportes recibidos</h2>
    <select data-act="filter">${['todos','Pendiente','En revisión','Resuelto'].map(s => `<option value="${s}"${s === st.filter ? ' selected' : ''}>${s === 'todos' ? 'Todos los estados' : s}</option>`).join('')}</select></div>
    ${list.length ? list.map(r => repCard(r, true)).join('') : '<div class="empty">No hay reportes con este filtro.</div>'}</div>`;
}
function viewUsuarios() {
  return `<div class="grid charts" style="align-items:start">
  <div class="card"><h2>Usuarios (${st.users.length})</h2><div style="overflow-x:auto"><table><tr><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Rol</th><th>Reportes</th></tr>
    ${st.users.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td><td>${u.role === 'admin' ? 'Admin' : 'Vecino'}</td><td>${u.reports}</td></tr>`).join('')}</table></div></div>
  <div class="card"><h2>Crear usuario</h2><form data-form="user">
    <label style="margin-top:0">Nombre completo</label><input name="name" required minlength="3">
    <label>Correo</label><input name="email" type="email" required>
    <label>Teléfono</label><input name="phone" type="tel" required>
    <label>Contraseña (mínimo 6)</label><input name="password" type="text" required minlength="6">
    <label>Rol</label><select name="role"><option value="vecino">Vecino (hace reportes)</option><option value="admin">Administrador</option></select>
    <div class="ferr"></div><button class="btn full">Crear usuario</button></form></div></div>`;
}
function viewCorreos() {
  return `<div class="card"><h2>Correos</h2>${st.emailsSmtp ? '' : '<p class="tip" style="margin:0 0 10px">El servidor no tiene SMTP configurado: los correos se registran aquí como «simulado» pero no salen. Configura las variables SMTP para enviarlos de verdad.</p>'}
    <div style="overflow-x:auto"><table><tr><th>Fecha</th><th>Para</th><th>Asunto</th><th>Estado</th></tr>
    ${st.emails.length ? st.emails.map(e => `<tr><td>${fmtDate(e.created_at)}</td><td>${esc(e.to_addr)}</td><td>${esc(e.subject)}</td><td>${esc(e.status)}${e.error ? '<br><small style="color:var(--err)">' + esc(e.error) + '</small>' : ''}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">Sin correos todavía</td></tr>'}</table></div></div>`;
}

function render() {
  const app = $('#app');
  if (!st.me) { app.innerHTML = authView(); return; }
  const V = { mis:viewMis, nuevo:viewNuevo, hecho:viewHecho, panel:viewPanel, reportes:viewReportes, usuarios:viewUsuarios, correos:viewCorreos };
  app.innerHTML = shell((V[st.view] || viewMis)());
}
async function go(v) {
  st.view = v;
  if (['mis','panel','reportes'].includes(v)) st.reports = (await api('GET', '/api/reports')).reports;
  if (['panel','usuarios'].includes(v) && st.me.role === 'admin') st.users = (await api('GET', '/api/users')).users;
  if (v === 'correos') { const d = await api('GET', '/api/emails'); st.emails = d.emails; st.emailsSmtp = d.smtp; }
  if (v === 'nuevo') { st.t0 = Date.now(); st.foto = ''; }
  render(); window.scrollTo(0, 0);
}
const home = () => go(st.me.role === 'admin' ? 'panel' : 'mis');

// ---------- eventos ----------
const ferr = (f, msg) => { const e = f.querySelector('.ferr'); if (e) e.textContent = msg || ''; };
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT') return;
  const a = el.dataset.act;
  try {
    if (a === 'mode') { st.authMode = el.dataset.m; render(); }
    else if (a === 'go') await go(el.dataset.v);
    else if (a === 'logout') { await api('POST', '/api/logout'); st.me = null; st.authMode = 'login'; render(); }
    else if (a === 'star') { const f = el.closest('form'); f.dataset.val = el.dataset.v; f.querySelectorAll('.stars button').forEach(b => b.classList.toggle('on', Number(b.dataset.v) <= Number(el.dataset.v))); }
    else if (a === 'gps') {
      const f = el.closest('form');
      if (!navigator.geolocation) return ferr(f, 'Tu navegador no permite GPS. Escribe la ubicación.');
      ferr(f, 'Buscando ubicación…');
      navigator.geolocation.getCurrentPosition(p => { f.elements.location.value = `GPS: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`; ferr(f, ''); }, () => ferr(f, 'No se pudo obtener el GPS (en HTTP solo funciona en localhost). Escribe la ubicación.'));
    }
  } catch (err) { toast(err.message, true); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.act === 'filter') { st.filter = e.target.value; render(); return; }
  if (e.target.name === 'foto') {
    const f = e.target.files[0], form = e.target.closest('form'); st.foto = ''; $('#prev').style.display = 'none';
    if (!f) return;
    if (!f.type.startsWith('image/')) { e.target.value = ''; return ferr(form, 'El archivo debe ser una imagen.'); }
    ferr(form, '');
    const img = new Image(), rd = new FileReader();
    rd.onload = () => { img.onload = () => { const s = Math.min(1, 700 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      st.foto = c.toDataURL('image/jpeg', 0.7); $('#prev').src = st.foto; $('#prev').style.display = 'block'; }; img.src = rd.result; };
    rd.readAsDataURL(f);
  }
});
document.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target, kind = f.dataset.form, v = n => (f.elements[n] ? f.elements[n].value : '');
  ferr(f, ''); const btn = f.querySelector('.btn:not(.soft)'); if (btn) btn.disabled = true;
  try {
    if (kind === 'login' || kind === 'register') {
      const body = kind === 'login' ? { email:v('email'), password:v('password') } : { name:v('name'), phone:v('phone'), email:v('email'), password:v('password') };
      st.me = (await api('POST', '/api/' + kind, body)).user; await home();
    } else if (kind === 'new') {
      if (!st.foto) throw new Error('Falta la foto del poste.');
      const d = await api('POST', '/api/reports', { photo:st.foto, location:v('location'), reference:v('reference'), note:v('note'), name:v('name'), phone:v('phone'), email:v('email'), form_seconds:Math.round((Date.now() - st.t0) / 1000) });
      st.done = d; st.foto = ''; st.view = 'hecho'; render(); window.scrollTo(0, 0);
    } else if (kind === 'status') {
      await api('PATCH', '/api/reports/' + f.dataset.id, { status:v('status'), reply:v('reply') });
      st.reports = (await api('GET', '/api/reports')).reports; render(); toast('Cambios guardados');
    } else if (kind === 'rate') {
      if (!f.dataset.val) throw new Error('Elige de 1 a 5 estrellas.');
      await api('POST', `/api/reports/${f.dataset.id}/rating`, { rating:Number(f.dataset.val), feedback:v('feedback') });
      st.reports = (await api('GET', '/api/reports')).reports; render(); toast('¡Gracias por tu opinión!');
    } else if (kind === 'user') {
      await api('POST', '/api/users', { name:v('name'), email:v('email'), phone:v('phone'), password:v('password'), role:v('role') });
      st.users = (await api('GET', '/api/users')).users; render(); toast('Usuario creado');
    }
  } catch (err) { ferr(f, err.message); if (!f.querySelector('.ferr')) toast(err.message, true); if (btn) btn.disabled = false; }
});

(async () => {
  try { st.cfg = await api('GET', '/api/config'); st.me = (await api('GET', '/api/me')).user; } catch {}
  if (st.me) await home(); else render();
})();
</script>
</body>
</html>
